name: ops-run005-c-r7

# Run 005 — arm C hybrid RRF k=60 (T-C13), R7 NOTES-AXIS-PROMOTION generation
# (snap-006 + gold-v5; the operator's notes-axis promotion IS IN via SNAP6-F1,
# 2026-09-28). Benchmark-only; never on push/PR. Consumes the R7 arm-B and
# arm-A results committed to evidence/bench-001/runs/. §8(d) scores with
# coverage for the first time (the HV-mapped notes chunks now serve); the r6
# interpretation pre-registration (records 09a624728) binds the reading — a
# non-zero (d) beside weak (a)/(b)/(c) is a coverage signal, not a
# retrieval-quality signal. Core pin d9cb3ddcf2 = the r7 generation pin (same as run-003-b-r7 / run-004-a-r7; serving SQL emission-identical to 05f262169).
# Output: results.json + RUN_REPORT.md + SHA256SUMS (uploaded artifact).

on:
  workflow_dispatch:

jobs:
  run005c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout records repo (frozen inputs + artifact + prior runs)
        uses: actions/checkout@v4
        with:
          path: records

      - name: Checkout core (harness, pinned sha)
        uses: actions/checkout@v4
        with:
          repository: SyllabAI/syllabai-core
          ref: d9cb3ddcf2b241411fe74e575fac8194c7ca9f8a
          path: core

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: run005c-r7-m2-${{ hashFiles('core/pom.xml') }}
          restore-keys: run005c-r7-m2-

      - name: Build classpath
        working-directory: core
        run: mvn -B -ntp -q test-compile dependency:build-classpath -Dmdep.outputFile=../cp.txt

      - name: Run arm C hybrid replay (zero API calls)
        working-directory: core
        env:
          BENCH_JDBC_URL: jdbc:postgresql://localhost:5433/postgres
          BENCH_JDBC_USER: bench
          BENCH_JDBC_PASSWORD: bench
          BENCH_SNAPSHOT: ${{ github.workspace }}/records/bench/inputs/snapshot-r7
          BENCH_GOLD: ${{ github.workspace }}/records/bench/inputs/gold-r7
          BENCH_EMBED_ARTIFACT: ${{ github.workspace }}/records/bench/inputs/embeddings/preload-r7
          BENCH_RUN_OUT: ${{ github.workspace }}/run005c-out
          BENCH_RUN003B_RESULTS: ${{ github.workspace }}/records/evidence/bench-001/runs/run-003-b-r7/results.json
          BENCH_RUN004A_RESULTS: ${{ github.workspace }}/records/evidence/bench-001/runs/run-004-a-r7/results.json
          BENCH_CORE_COMMIT: d9cb3ddcf2b241411fe74e575fac8194c7ca9f8a
          BENCH_RUN_DATE: "2026-09-28"
        run: java -Xmx3g -cp "target/test-classes:target/classes:$(cat ../cp.txt)" com.syllabai.bench.Run005C

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-005-c-r7
          path: run005c-out/
          retention-days: 90
