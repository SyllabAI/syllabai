name: ops-embed-backfill-r5

# R5 AT-FLIP embed artifact (T-C27 trigger-A re-run, 2026-09-27): same
# production-shaped EmbedBackfill runner (pinned core sha = the at-flip
# enabler e728b7d) as ops-embed-backfill-r4, pointed at the R5 staged inputs
# snapshot-r5 (= snap-004, the at-flip freeze: 317 validation-wave flips, card
# subject_id projected via SNAP4-F3) + gold-r5 (= gold-v3, records
# byte-identical to gold-v2, re-paired to snap-004). The staged preload-r5 is
# production-derived (3,831/3,831 chunk vectors mirrored SELECT-only, all
# gemini-embedding-001@768, per-row content_sha256 verified) — expected: 0
# chunk API calls, 120 gold query embeddings fresh. Benchmark-only; manual
# dispatch only. Operator-directed at-flip recorded run (AT_FLIP_RUNBOOK.md
# trigger A; directive traces 1a0e23212e7b3cf5 + 1a0e2220d22a90b1; wave
# verified first-hand; coordination handoff a61bdb008 honored).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Embedding model (dimension-compatible with vector(768))"
        default: "gemini-embedding-001"
      min_interval_ms:
        description: "Min interval between embedding calls (ms)"
        default: "600"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout records repo (frozen inputs)
        uses: actions/checkout@v4
        with:
          path: records

      - name: Checkout core (runner code, pinned sha)
        uses: actions/checkout@v4
        with:
          repository: SyllabAI/syllabai-core
          ref: e728b7deaf6a3c21acb78d420c93904c9213e13e
          path: core

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: embed-backfill-m2-r5-${{ hashFiles('core/pom.xml') }}
          restore-keys: embed-backfill-m2-r5-

      - name: Build classpath
        working-directory: core
        run: mvn -B -ntp -q test-compile dependency:build-classpath -Dmdep.outputFile=../cp.txt

      - name: Run embedding backfill (production provider path)
        working-directory: core
        env:
          BENCH_JDBC_URL: jdbc:postgresql://localhost:5433/postgres
          BENCH_JDBC_USER: bench
          BENCH_JDBC_PASSWORD: bench
          BENCH_SNAPSHOT: ${{ github.workspace }}/records/bench/inputs/snapshot-r5
          BENCH_GOLD: ${{ github.workspace }}/records/bench/inputs/gold-r5
          BENCH_PRELOAD_ARTIFACT: ${{ github.workspace }}/records/bench/inputs/embeddings/preload-r5
          BENCH_RUN_OUT: ${{ github.workspace }}/embed-out-r5
          BENCH_CORE_COMMIT: e728b7deaf6a3c21acb78d420c93904c9213e13e
          BENCH_RUN_DATE: "2026-09-27"
          SYLLABAI_EMBEDDING_GEMINI_API_KEY: ${{ secrets.SYLLABAI_EMBEDDING_GEMINI_API_KEY }}
          SYLLABAI_EMBEDDING_GEMINI_API_KEYS: ${{ secrets.SYLLABAI_EMBEDDING_GEMINI_API_KEYS }}
          EMBED_MODEL: ${{ inputs.model }}
          EMBED_MIN_INTERVAL_MS: ${{ inputs.min_interval_ms }}
        run: java -Xmx2g -cp "target/test-classes:target/classes:$(cat ../cp.txt)" com.syllabai.bench.EmbedBackfill

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embed-backfill-snap-001-r5
          path: embed-out-r5/
          retention-days: 90
