name: ops-run003-b-r6

# Run 003B — arm B lexical (T-C13), R6 AT-FLIP generation (snap-005 + gold-v4
# staged as snapshot-r6/gold-r6; the operator card wave is IN via SNAP5-F1/F5,
# 2026-09-28). Benchmark-only; never on push/PR. The §8(d) spec-resolution axis
# scores on this generation for the first time (SNAP5-H1 chunk_spec_hv.json).
# Output: results.json + RUN_REPORT.md + SHA256SUMS (uploaded artifact).

on:
  workflow_dispatch:

jobs:
  run003b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout records repo (frozen inputs)
        uses: actions/checkout@v4
        with:
          path: records

      - name: Checkout core (harness, pinned sha)
        uses: actions/checkout@v4
        with:
          repository: SyllabAI/syllabai-core
          ref: 05f2621690843123758fe271bdfcacae9b4ed220
          path: core

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: run003b-r6-m2-${{ hashFiles('core/pom.xml') }}
          restore-keys: run003b-r6-m2-

      - name: Build classpath
        working-directory: core
        run: mvn -B -ntp -q test-compile dependency:build-classpath -Dmdep.outputFile=../cp.txt

      - name: Run arm B lexical replay (zero API calls)
        working-directory: core
        env:
          BENCH_JDBC_URL: jdbc:postgresql://localhost:5433/postgres
          BENCH_JDBC_USER: bench
          BENCH_JDBC_PASSWORD: bench
          BENCH_SNAPSHOT: ${{ github.workspace }}/records/bench/inputs/snapshot-r6
          BENCH_GOLD: ${{ github.workspace }}/records/bench/inputs/gold-r6
          BENCH_RUN_OUT: ${{ github.workspace }}/run003b-out
          BENCH_CORE_COMMIT: 05f2621690843123758fe271bdfcacae9b4ed220
          BENCH_RUN_DATE: "2026-09-28"
        run: java -Xmx3g -cp "target/test-classes:target/classes:$(cat ../cp.txt)" com.syllabai.bench.Run003B

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-003-b-r6
          path: run003b-out/
          retention-days: 90

