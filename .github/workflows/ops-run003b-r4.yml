name: ops-run003-b-r4

# Run 003 — arm B lexical replay (T-C13/T-C14), R4 generation (snap-003 + gold-v2
# staged as snapshot-r4/gold-r4; card axis IN via SNAP3-F1, 2026-09-27).
# Benchmark-only; never on push/PR. Operator-commissioned pre-flip recorded run
# (AT_FLIP_RUNBOOK.md trigger B; directive recorded in .syllabai/tasks/T-C27.yaml).
# Drives the PRODUCTION lexical serving path (ChunkLexicalRepository SQL:
# websearch_to_tsquery('english') over content_tsv GIN, ts_rank_cd, T-C07 scope,
# T-C05 VALIDATED-paper serving) through Bm25Retriever over a disposable pgvector
# service container migrated with the real Flyway chain. ZERO API calls at run
# time. Fail-closed: snapshot/gold SHA verification via BenchSnapshot/BenchGold
# loaders; scoring recomputed twice, serialized results must be byte-identical
# or the run aborts.
# Output: results.json + RUN_REPORT.md + SHA256SUMS (uploaded artifact).
# R4 delta vs run-003-b-r3 (2026-09-20): snapshot-r4 (194 spec points, 3,831
# chunks incl. 1,056 card chunks, 720 anchors, chunk spec_codes SNAP3-F3) +
# gold-r4 (120 queries, 15 card-anchored records); BENCH_RUN001_RESULTS
# deliberately unset (stale-premise note carried from r3 — readJson tolerance
# yields an empty context map).

on:
  workflow_dispatch:

jobs:
  run003b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout records repo (frozen inputs)
        uses: actions/checkout@v4
        with:
          path: records

      - name: Checkout core (harness, pinned sha)
        uses: actions/checkout@v4
        with:
          repository: SyllabAI/syllabai-core
          ref: 45f6774d7e3f6e575afa4a03d70fbb4724f93df6
          path: core

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: run003b-r4-m2-${{ hashFiles('core/pom.xml') }}
          restore-keys: run003b-r4-m2-

      - name: Build classpath
        working-directory: core
        run: mvn -B -ntp -q test-compile dependency:build-classpath -Dmdep.outputFile=../cp.txt

      - name: Run arm B lexical replay (zero API calls)
        working-directory: core
        env:
          BENCH_JDBC_URL: jdbc:postgresql://localhost:5433/postgres
          BENCH_JDBC_USER: bench
          BENCH_JDBC_PASSWORD: bench
          BENCH_SNAPSHOT: ${{ github.workspace }}/records/bench/inputs/snapshot-r4
          BENCH_GOLD: ${{ github.workspace }}/records/bench/inputs/gold-r4
          BENCH_RUN_OUT: ${{ github.workspace }}/run003b-out
          BENCH_CORE_COMMIT: 45f6774d7e3f6e575afa4a03d70fbb4724f93df6
          BENCH_RUN_DATE: "2026-09-27"
        run: java -Xmx3g -cp "target/test-classes:target/classes:$(cat ../cp.txt)" com.syllabai.bench.Run003B

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-003-b-r4
          path: run003b-out/
          retention-days: 90
