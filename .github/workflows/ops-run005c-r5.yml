name: ops-run005-c-r5

# Run 005 — arm C hybrid replay (T-C13), R5 AT-FLIP generation (snap-004 +
# gold-v3 staged as snapshot-r5/gold-r5; the validation wave is IN via
# SNAP4-F1, 2026-09-27). Benchmark-only; never on push/PR. Operator-directed
# at-flip recorded run (AT_FLIP_RUNBOOK.md trigger A; directive traces
# 1a0e23212e7b3cf5 + 1a0e2220d22a90b1; wave verified first-hand).
# Drives the PRODUCTION retrieval fabric orchestrator (RetrievalFabric: explicit
# arms [pgvector, bm25], central BoundaryPolicy, shipped ReciprocalRankFusion
# k=60) over the frozen R5 embedding artifact (embed-backfill-snap-001-r5:
# 3831/3831 chunks + 120 gold queries, gemini-embedding-001@768) on a
# disposable pgvector service container. ZERO API calls at run time —
# compute-once-freeze-forever. Dual view: served (production truth, ALL
# denominator — the §8 gate target, ruling 1) + compliant (central VALIDATED gate
# pre-fusion, zero-violation by construction, hard-fails on any leak). Fail-closed
# artifact verification against the exact frozen snapshot/gold inputs; double-pass
# determinism. Core pin e728b7d = the at-flip enabler (loader carries
# documents.validation_state + bench-scope subject stamps; BOTH
# searchServingEligible branches production-faithful; core-ci 36310569728 green).
# Output: results.json + RUN_REPORT.md + SHA256SUMS (uploaded artifact).
# R5 delta vs run-005-c-r4 (2026-09-27): -r5 input paths; BENCH_RUN003B_RESULTS /
# BENCH_RUN004A_RESULTS point at the R5 run dirs committed before this dispatch;
# BENCH_RUN002A0_RESULTS deliberately unset — arm A0's premise (0/2333 embedded)
# is stale for the R5 generation and its role as the before-picture is carried by
# the live rev1 baseline (Task 27, baseline_armA_rev1.json); overallOf marks the
# absent context honestly as UNAVAILABLE.

on:
  workflow_dispatch:

jobs:
  run005c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout records repo (frozen inputs + artifact + prior runs)
        uses: actions/checkout@v4
        with:
          path: records

      - name: Checkout core (harness, pinned sha)
        uses: actions/checkout@v4
        with:
          repository: SyllabAI/syllabai-core
          ref: e728b7deaf6a3c21acb78d420c93904c9213e13e
          path: core

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: run005c-r5-m2-${{ hashFiles('core/pom.xml') }}
          restore-keys: run005c-r5-m2-

      - name: Build classpath
        working-directory: core
        run: mvn -B -ntp -q test-compile dependency:build-classpath -Dmdep.outputFile=../cp.txt

      - name: Run arm C hybrid replay (zero API calls)
        working-directory: core
        env:
          BENCH_JDBC_URL: jdbc:postgresql://localhost:5433/postgres
          BENCH_JDBC_USER: bench
          BENCH_JDBC_PASSWORD: bench
          BENCH_SNAPSHOT: ${{ github.workspace }}/records/bench/inputs/snapshot-r5
          BENCH_GOLD: ${{ github.workspace }}/records/bench/inputs/gold-r5
          BENCH_EMBED_ARTIFACT: ${{ github.workspace }}/records/bench/inputs/embeddings/preload-r5
          BENCH_RUN_OUT: ${{ github.workspace }}/run005c-out
          BENCH_RUN003B_RESULTS: ${{ github.workspace }}/records/evidence/bench-001/runs/run-003-b-r5/results.json
          BENCH_RUN004A_RESULTS: ${{ github.workspace }}/records/evidence/bench-001/runs/run-004-a-r5/results.json
          BENCH_CORE_COMMIT: e728b7deaf6a3c21acb78d420c93904c9213e13e
          BENCH_RUN_DATE: "2026-09-27"
        run: java -Xmx3g -cp "target/test-classes:target/classes:$(cat ../cp.txt)" com.syllabai.bench.Run005C

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-005-c-r5
          path: run005c-out/
          retention-days: 90
