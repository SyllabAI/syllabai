name: ops-run003-b-r5

# Run 003 — arm B lexical replay (T-C13), R5 AT-FLIP generation (snap-004 +
# gold-v3 staged as snapshot-r5/gold-r5; the validation wave is IN via
# SNAP4-F1: 317 chunks paper_state VALIDATED — 13 papers' QP/MS + the
# pre-existing 4CH1/1C card doc; 298 T-C27 cards still SUGGESTED, honestly
# inert, 2026-09-27). Benchmark-only; never on push/PR. Operator-directed
# at-flip recorded run (AT_FLIP_RUNBOOK.md trigger A; directive traces
# 1a0e23212e7b3cf5 + 1a0e2220d22a90b1; wave verified first-hand).
# Drives the PRODUCTION lexical serving path (ChunkLexicalRepository SQL:
# websearch_to_tsquery('english') over content_tsv GIN, ts_rank_cd, T-C07 scope,
# T-C05 VALIDATED-paper serving) through Bm25Retriever over a disposable pgvector
# service container migrated with the real Flyway chain. ZERO API calls at run
# time. Fail-closed: snapshot/gold SHA verification via BenchSnapshot/BenchGold
# loaders; scoring recomputed twice, serialized results must be byte-identical
# or the run aborts. Core pin e728b7d = the at-flip enabler (loader carries
# documents.validation_state + bench-scope subject stamps; BOTH
# searchServingEligible branches production-faithful; core-ci 36310569728 green).
# Output: results.json + RUN_REPORT.md + SHA256SUMS (uploaded artifact).
# R5 delta vs run-003-b-r4 (2026-09-27): snapshot-r5 (3,831 chunks, 317
# serving-eligible flips, chunk paper_code stamps, subject_id projection) +
# gold-r5 (gold-v3 = gold-v2 records byte-identical, snapshot pins re-issued to
# snap-004); BENCH_RUN001_RESULTS deliberately unset (stale-premise note
# carried from r3/r4 — readJson tolerance yields an empty context map).

on:
  workflow_dispatch:

jobs:
  run003b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout records repo (frozen inputs)
        uses: actions/checkout@v4
        with:
          path: records

      - name: Checkout core (harness, pinned sha)
        uses: actions/checkout@v4
        with:
          repository: SyllabAI/syllabai-core
          ref: e728b7deaf6a3c21acb78d420c93904c9213e13e
          path: core

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: run003b-r5-m2-${{ hashFiles('core/pom.xml') }}
          restore-keys: run003b-r5-m2-

      - name: Build classpath
        working-directory: core
        run: mvn -B -ntp -q test-compile dependency:build-classpath -Dmdep.outputFile=../cp.txt

      - name: Run arm B lexical replay (zero API calls)
        working-directory: core
        env:
          BENCH_JDBC_URL: jdbc:postgresql://localhost:5433/postgres
          BENCH_JDBC_USER: bench
          BENCH_JDBC_PASSWORD: bench
          BENCH_SNAPSHOT: ${{ github.workspace }}/records/bench/inputs/snapshot-r5
          BENCH_GOLD: ${{ github.workspace }}/records/bench/inputs/gold-r5
          BENCH_RUN_OUT: ${{ github.workspace }}/run003b-out
          BENCH_CORE_COMMIT: e728b7deaf6a3c21acb78d420c93904c9213e13e
          BENCH_RUN_DATE: "2026-09-27"
        run: java -Xmx3g -cp "target/test-classes:target/classes:$(cat ../cp.txt)" com.syllabai.bench.Run003B

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-003-b-r5
          path: run003b-out/
          retention-days: 90
