name: ops-finish-pending-v2

# finish-pending-v2 (Task 33, 2026-09-21): complete the corpus-v2 (rev2) ingest
# embed that stalled on the then-serving key's daily quota — 584 EXTERNAL_QUESTIONS
# chunks / 61 documents pending in production document_chunks.
#
# The vectors are produced BY THE PRODUCTION APP (POST /{id}/embed, Spring AI
# batched transport) because CI single-call REST vectors are a different vector
# space (evidence/bench-001/embed-bridge-v2/CORRECTION.md — cross-space top-10
# rank agreement 0.79). This workflow rotates the Render embedding key to a
# REMAINING key (default order 1,3,0 — the stalled serving key index 2,
# sha256:797b77a879, is deliberately excluded), redeploys, then drives the
# app's own embed endpoint per document (idempotent, resumable).
# Raw key values never reach logs or artifacts — fingerprints only.
# Manual dispatch only; never on push/PR.

on:
  workflow_dispatch:
    inputs:
      key_order:
        description: "0-based indices into SYLLABAI_EMBEDDING_GEMINI_API_KEYS to rotate through"
        default: "1,3,0"

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout records repo (frozen inputs)
        uses: actions/checkout@v4

      - name: Rotate Render key + drive app-side embed of pending rev2 chunks
        env:
          SYLLABAI_EMBEDDING_GEMINI_API_KEYS: ${{ secrets.SYLLABAI_EMBEDDING_GEMINI_API_KEYS }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          KEY_ORDER: ${{ inputs.key_order }}
          FINISH_OUT: ${{ github.workspace }}/finish-out-pending-v2
        run: python3 bench/inputs/pending-v2/finish_pending_v2.py

      - name: Upload finish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finish-pending-v2
          path: finish-out-pending-v2/
          retention-days: 90
