name: ops-run005-c

# Run 005 — arm C hybrid replay (T-C13, spec §7 M2). Benchmark-only; never on push/PR.
# Drives the PRODUCTION retrieval fabric orchestrator (RetrievalFabric: explicit
# arms [pgvector, bm25], central BoundaryPolicy, shipped ReciprocalRankFusion
# k=60) over the frozen COMPLETE embedding artifact (embed-backfill-snap-001:
# 2333/2333 chunks + 120 gold queries, gemini-embedding-001@768) on a disposable
# pgvector service container. ZERO API calls at run time — compute-once-freeze-forever.
# Dual view: served (production truth, ALL denominator — the §8 gate target,
# ruling 1) + compliant (central VALIDATED gate pre-fusion, zero-violation by
# construction, hard-fails on any leak). Fail-closed artifact verification
# against the exact frozen snapshot/gold inputs; double-pass determinism.
# Output: results.json + RUN_REPORT.md + SHA256SUMS (uploaded artifact).

on:
  workflow_dispatch:

jobs:
  run005c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout records repo (frozen inputs + artifact + prior runs)
        uses: actions/checkout@v4
        with:
          path: records

      - name: Checkout core (harness, pinned sha)
        uses: actions/checkout@v4
        with:
          repository: SyllabAI/syllabai-core
          ref: c05efb98355ada8a3328c2781148072b556c8c24
          path: core

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: run005c-m2-${{ hashFiles('core/pom.xml') }}
          restore-keys: run005c-m2-

      - name: Build classpath
        working-directory: core
        run: mvn -B -ntp -q test-compile dependency:build-classpath -Dmdep.outputFile=../cp.txt

      - name: Run arm C hybrid replay (zero API calls)
        working-directory: core
        env:
          BENCH_JDBC_URL: jdbc:postgresql://localhost:5433/postgres
          BENCH_JDBC_USER: bench
          BENCH_JDBC_PASSWORD: bench
          BENCH_SNAPSHOT: ${{ github.workspace }}/records/bench/inputs/snapshot
          BENCH_GOLD: ${{ github.workspace }}/records/bench/inputs/gold
          BENCH_EMBED_ARTIFACT: ${{ github.workspace }}/records/bench/inputs/embeddings/preload
          BENCH_RUN_OUT: ${{ github.workspace }}/run005c-out
          BENCH_RUN003B_RESULTS: ${{ github.workspace }}/records/evidence/bench-001/runs/run-003-b/results.json
          BENCH_RUN004A_RESULTS: ${{ github.workspace }}/records/evidence/bench-001/runs/run-004-a/results.json
          BENCH_RUN002A0_RESULTS: ${{ github.workspace }}/records/evidence/bench-001/runs/run-002-a0/results.json
          BENCH_CORE_COMMIT: c05efb98355ada8a3328c2781148072b556c8c24
          BENCH_RUN_DATE: "2026-09-17"
        run: java -Xmx3g -cp "target/test-classes:target/classes:$(cat ../cp.txt)" com.syllabai.bench.Run005C

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-005-c
          path: run005c-out/
          retention-days: 90
