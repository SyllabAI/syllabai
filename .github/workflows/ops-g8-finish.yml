name: ops-g8-finish

# g8-finish (G8 backfill lane, 2026-09-21): complete the G8 paper-axis embed —
# 66 papers x qp/ms ingested 2026-09-21 as rev2 chunks, cut twice by daily key
# quota (serving key index 1 then index 2 both exhausted), plus the final 8
# papers posted after the parser fix (4CH0-1C-201601, 5x 4CH1-2CR, 2x specimen):
# 59 documents / 744 chunks pending (frozen in bench/inputs/g8-finish/).
#
# Vectors are produced BY THE PRODUCTION APP (POST /{id}/embed, Spring AI
# batched transport) because CI single-call REST vectors are a different vector
# space (evidence/bench-001/embed-bridge-v2/CORRECTION.md — cross-space top-10
# rank agreement 0.79). This workflow rotates the Render embedding key to a
# REMAINING key (default order 3,0,1,2 — indices 1 and 2 are the two keys
# already exhausted today), redeploys, then drives the app's own embed endpoint
# per document (idempotent, resumable, fail-fast on 3 consecutive HTTP
# failures). Raw key values never reach logs or artifacts — fingerprints only.
# Manual dispatch only; never on push/PR.

on:
  workflow_dispatch:
    inputs:
      key_order:
        description: "0-based indices into SYLLABAI_EMBEDDING_GEMINI_API_KEYS to rotate through"
        default: "3,0,1,2"

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout records repo (frozen inputs)
        uses: actions/checkout@v4

      - name: Rotate Render key + drive app-side embed of pending G8 chunks
        env:
          SYLLABAI_EMBEDDING_GEMINI_API_KEYS: ${{ secrets.SYLLABAI_EMBEDDING_GEMINI_API_KEYS }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          KEY_ORDER: ${{ inputs.key_order }}
          FINISH_OUT: ${{ github.workspace }}/finish-out-g8
        run: python3 bench/inputs/g8-finish/finish_g8.py

      - name: Upload finish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finish-g8
          path: finish-out-g8/
          retention-days: 90
