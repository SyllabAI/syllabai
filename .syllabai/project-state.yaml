# Canonical multi-agent coordination state.
# This file is operational state, not educational truth. Git HEAD is the source of current code state;
# this ledger records the last verified project milestone and coordination policy rather than a live HEAD hash.
version: 1
project:
  name: SyllabAI
  state: GREEN
  state_basis: >-
    R3-4 canonical replay + retained evidence. Refreshed 2026-10-04 under
    T-COORD-3 R-E (operator trace 4acec4babbc5db5c842fa4bce379e604): the
    critical re-audit found this ledger 21 days stale (last_verified
    2026-09-13 @ 760a3f9) with empty work/lock lists while 10 packets were
    open — active_work/resource_locks below now mirror the packet registry
    and locks.yaml; regenerate on close-out of any lane.
  last_verified_at: 2026-10-04
  last_verified_main_commit: 87f522ecd698b525781515f9b33b8deba6eb6c5a
  canonical_branch: main
  current_head_source: git-main

repositories:
  syllabai:
    branch: main
    current_head: derive-from-git
  syllabai-core:
    role: backend
    owner_surface: core
    current_head: derive-from-git
  syllabai-parser:
    role: ingestion
    owner_surface: parser
    current_head: derive-from-git
  syllabai-web:
    role: frontend
    owner_surface: web
    current_head: derive-from-git
  syllabai-resources:
    role: validated-resource-corpus
    owner_surface: resources
    current_head: derive-from-git
  syllabai-pastpapers:
    role: canonical-past-paper-data
    owner_surface: corpus
    current_head: derive-from-git
  Past-Papers:
    role: official-source-corpus
    owner_surface: source-corpus
    current_head: derive-from-git

truth_tiers:
  T0: official_external_source
  T1: validated_syllabai_truth
  T2: derived_system_state
  T3: agent_candidate_or_suggestion
  T4: ephemeral_execution_state

invariants:
  applied_flyway_migrations_immutable: true
  imported_assessment_requires_validation: true
  unvalidated_content_must_not_serve: true
  authoritative_kg_requires_promotion_gate: true
  campaign_db_identity_required: true
  durable_milestone_evidence_required: true
  claims_must_be_labeled: true

active_work: # mirror of the open-packet frontier (T-COORD-3 R-E; authoritative source: .syllabai/tasks/*.yaml + TODO-CURRENT.md)
  - T-C44
  - T-C47
  - T-C50
  - T-C51
  - T-C55
  - T-C60
  - T-C70
  - T-C75
  - T-C79
blocked_work: []
resource_locks: # mirror of locks.yaml active leases (T-COORD-3 R-C)
  - {resource: core-web-contract, task: T-C79, expires_at: '2026-10-06T00:00:00Z'}
  - {resource: hub-e2e, task: T-C55, expires_at: '2026-10-08T00:00:00Z'}

claim_status:
  VERIFIED: "Backed by reproducible checks and durable evidence."
  INFERRED: "Strongly supported but not directly demonstrated."
  REPORTED: "Claimed by another agent without surviving evidence."
  UNVERIFIED: "No adequate evidence currently exists."
