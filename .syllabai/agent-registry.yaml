# Agent ownership registry. One primary owner per surface; ownership does not prohibit coordinated fixes.
version: 1
agents:
  control:
    owns: [project-state, task-graph, locks, evidence-policy]
  core:
    repo: syllabai-core
    owns: [backend, domain-modules, database-schema, flyway-migrations]
    # T-COORD-3 R-B: canonicalised to declared shared resources
    # ('shared-contracts' -> core-web-contract + parser-core-contract;
    #  'migrations' -> flyway-version + database-schema;
    #  'cross-repo-breaking-changes' is governed by the stale-base rule below,
    #  not a leaseable resource).
    requires_coordination_for: [flyway-version, database-schema, core-web-contract, parser-core-contract]
  hub:
    repo: syllabai-hub
    owns: [product-frontend, learner-surfaces, dashboard]
    # T-COORD-3 R-B: registered per ADR-029 (hub = the product frontend since
    # 2026-09-28); the registry predated the promotion and had no hub entry.
    requires_coordination_for: [core-web-contract, hub-e2e]
  parser:
    repo: syllabai-parser
    owns: [offline-ingestion, extraction, parser-output-contracts]
    requires_coordination_for: [parser-core-contract]
  web:
    repo: syllabai-web
    owns: [frontend, teacher-ui, student-ui]
    requires_coordination_for: [core-web-contract]
  resources:
    repo: syllabai-resources
    owns: [validated-resource-corpus, retrieval-corpus-preparation]
    requires_coordination_for: [authoritative-kg-promotion]
  corpus:
    repo: syllabai-pastpapers
    owns: [canonical-past-paper-data, manifests, provenance-ledgers]
  source-corpus:
    repo: Past-Papers
    owns: [official-source-corpus]
  kg:
    owns: [t-c11-knowledge-graph-promotion]
    requires_coordination_for: [authoritative-kg-promotion]

shared_resources:
  database-schema:
    allocation: serialized
  flyway-version:
    allocation: serialized
  parser-core-contract:
    allocation: coordinated
  core-web-contract:
    allocation: coordinated
  hub-e2e:
    allocation: coordinated # T-COORD-3 R-B/R-C: surface-level e2e red-fix lanes (declared alongside the T-C55 renewal)
  authoritative-kg-promotion:
    allocation: operator-gated

rules:
  - Never independently reserve a shared resource.
  - Never modify an applied Flyway migration.
  - Never treat T3 suggestions as T0/T1 truth.
  - A stale base requires reconciliation before merge when touched files overlap.
  - Agents may continue independent work when dependencies are green; do not create manual batch-by-batch approval gates.
