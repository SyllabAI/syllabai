# Shared-resource leases. This file is a coordination ledger, not an educational data store.
# A lock must identify owner + task + base commit + expiry. Expired locks are stale and must be reclaimed.
version: 1
locks: []
# (T-C29's core-web-contract consumer lease was fulfilled — web PR #9 merged
#  as 9c9ab6b with web-ci + Vercel success — and released per the reclaim rule.)
# (T-C28's core-web-contract producer lease was fulfilled — learner payloads
#  serve applicability/specPoints, core PR #25 merged as 7063e61 with core-ci
#  success — and released per the reclaim rule. The web residue is a follow-up
#  consumer task, T-C29 in T-C28 next_safe_actions.)
# (T-C24's flyway-version lease for V39 was fulfilled — migration merged as
#  syllabai-core 3c1600c — and released per the reclaim rule.)
# (T-C25's core-web-contract consumer lease was fulfilled — web main pushed as
#  390feaa with web-ci success — and released per the reclaim rule.)

resource_classes:
  flyway-version:
    policy: serialized
    rationale: Two agents must never independently allocate the same migration version.
  database-schema:
    policy: serialized
  parser-core-contract:
    policy: coordinated
  core-web-contract:
    policy: coordinated
  authoritative-kg-promotion:
    policy: operator-gated

lease_schema:
  required: [resource, owner, task, base_commit, acquired_at, expires_at]
  rule: "Do not edit another active lease. Reconcile stale/expired leases explicitly."
