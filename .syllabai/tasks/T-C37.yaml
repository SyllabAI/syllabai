  execution_notes: >
    Design choices worth remembering: (1) the §13.5 panel lists EVERY enabled
    member with honest nulls for unmeasured — weakest measured first — because
    §13.5 says 'student list' and the §15 rule forbids letting a mean stand
    for the class; (2) the misconception leg exposes estimates ONLY on
    misconception nodes attached UNDER the drilled node (the heatmap's own
    miscoByNode discipline, now at student grain); (3) the evidence leg is
    roster-scoped AT THE QUERY (new JPQL), not filtered client-side, so the
    independent-student rule survives payload-size growth; (4) non-member
    reads are 404 (not 403) — the roster is the privacy boundary and an
    absent membership neither confirms nor denies enrollment elsewhere;
    (5) the hub page wires the node action through a ref so the memoized
    host never needs rebuilding on selection. Incident logged: the first
    core commit accidentally clobbered the existing
    ClassKnowledgeGraphServiceTest (a Write replaced the 389-line F-072
    aggregation test) — restored verbatim in the follow-up commit, its
    constructor call updated for the two new collaborators, and the §14 pins
    appended (nothing lost; verified by git show HEAD~1 diff).
