  basis: >
    The flashcard sync (lib/flashcard-bridge.ts) and the account queue gate
    (lib/flashcard-unified.ts useCoreReviewSchedule) both hard-code
    course === PILOT_COURSE_SLUG. The widening must make the account feed
    cover every deck-bearing pack WITHOUT inventing a hardcoded slug list —
    and without shipping gates that fire against anchors core cannot
    resolve. Scoping receipts (first-hand, this session):
    (1) core's ingest is ALREADY course-agnostic and fail-closed
    (FlashcardRatingController resolves subtopicCode against the ingested
    knowledge graph; unknown = 404, nothing written) — the constraint is
    ANCHOR AVAILABILITY, not a core-side gate;
    (2) the feed (T-C53) and trail (T-C61) read paths are course-agnostic
    full-trail reads — no single-course assumption found;
    (3) HAZARD FOUND: non-pilot corpus anchors are NOT core-safe today —
    bare numeric spec codes ("1.1", "3.5") collide across courses
    (ial-biology-18, ial-chemistry-17, igcse-physics-19 …all carry "1.1";
    knowledge_nodes has uq_knowledge_node_code, so a second bare-coded
    ingestion fails at the DB — but a hub gate that SENDS bare codes would
    attribute to whichever course's node claimed the code first), and
    several courses carry charset-unsafe anchors (":" / "_" / "." —
    "IGCSE_ACCOUNTING:S4.173", "ial-physics-T4.4:SUB_") that core's ingest
    pattern ^[A-Za-z0-9-]+$ would 400. A naive widen-to-all-deck-bearing
    gate is therefore WRONG (guaranteed 400 noise + a latent
    cross-course misattribution path);
    (4) the "44 deck-bearing packs" count in the T-C53/T-C57 ledger phrase
    could not be reproduced from any registry state (34 deck-bearing at the
    39-course era, 37 since the 49-course import; pilot subtopic decks =
    28) — recorded as a ledger miscount; the widening is PREDICATE-defined,
    not count-defined.
  design: >
    One registry-derived predicate, two consumers (the structural "widen
    BOTH or neither" guarantee T-C57's doc block asked for):
    src/lib/flashcard-sync-eligibility.ts (NEW, client-safe,
    generated-from-registry, committed) exports FLASHCARD_SYNC_COURSES +
    isFlashcardSyncCourse(); scripts/verify_flashcard_sync_courses.ts (NEW)
    re-derives the set from content/ and FAILS the prebuild on drift.
    Eligibility (all four must hold): registered in courses.json;
    deck-bearing (non-empty flashcards.json); curriculumCode present (the
    V53/ADR-030 core-registry bridge — the exact precedent the tutor gate
    uses; absent = core cannot anchor this course yet); CORE-SAFE ANCHORS —
    every TOPIC/SUBTOPIC-family code in the course bundle matches core's
    ingest charset ^[A-Za-z0-9-]+$ AND is course-prefixed
    (startsWith(boardCode + "-"), boardCode = curriculumCode minus a
    trailing -<4-digit-year>), which makes cross-course ambiguity
    impossible by construction. Both gates (bridge write + unified feed
    read) switch from the slug equality to isFlashcardSyncCourse —
    behavior today is byte-identical (the eligible set is exactly
    {igcse-chemistry-19}); when the ingestion lanes commission the next
    curriculum (curriculumCode + anchors land), the verifier forces the
    manifest regeneration and that course's sync flips on with ZERO code
    change. Core lane: tests + javadoc only — pin the multi-course
    contract (disjoint attribution across two courses' anchors; duplicate
    node code fail-closed at the graph; feed derives one queue across
    both courses; honesty pin extends to multi-course) and document the
    anchor contract where the next ingestion lane will read it.
