  execution_record: >
    2026-10-02. Fix: `ProductionGeometryEmbeddingProvider` replaces the
    hashing double inside KaRagFlowIT (commit 9649e52 on the PR branch, one
    file +103/−12). Design (candidate (b) of the PR-comment analysis,
    refined): a deterministic fixed-seed unit "corpus semantics" axis u;
    a text carrying the fixture's topic vocabulary is lifted
    v = 0.9·u + √0.19·r(text), r = the orthogonalized bag-of-hashed-words
    direction (Gram–Schmidt, guarded); unanchored texts return the pure
    remainder. This is NOT the ruled-out universal common-component lift —
    the axis component is gated on topical vocabulary, so refusalAsk's
    off-corpus query never touches the axis and keeps sub-floor geometry BY
    CONSTRUCTION. Resulting envelope vs the calibration pack's measured
    production geometry: same-topic pairs [0.62, 1.0] by construction (pack
    relevant ≥ 0.55); unrelated pairs ≤ √0.19 ≈ 0.436 (pack irrelevant
    ≤ 0.45). LOCAL VERIFICATION (no Docker in the sandbox — the IT itself is
    CI-certified): a harness compiled the provider class extracted
    byte-mechanically from the edited file and asserted the envelope against
    the three verbatim IT queries and every one of the 636 fixture-document
    strings (a superset of anything ChunkingService can emit): 64 relevant
    pairs min cosine 0.8091; max unrelated cosine 0.0441 (the refusal
    query's token collision-freedom holds under the remainder leg too);
    determinism across instances, unit norms, and doc/query symmetry all
    pass; mvn test-compile green on JDK 25. CI: run 36919822481 on the PR
    head 9649e52 — FULL SUITE GREEN (the previous run's sole failure,
    KaRagFlowIT.hybridAsk:241 "expected MARK_SCHEME but was
    KNOWLEDGE_NODE", is gone). Design record posted as PR #44 comment
