  findings_part1_triggers:
    - "The corruption NEVER EXISTED. Byte-level proof: git show origin/main
      .github/workflows/ci.yml for BOTH core and hub renders
      `branches: [main]` with every byte present (od -c dump preserved in
      backlog/CI-TRIGGER-VERDICT-2026-09-29.md)."
    - "Root cause of the phantom: `[m` inside `[main]` is a valid ANSI/SGR
      reset sequence when stripped without requiring the ESC prefix, so
      colorized tool output piped through the session's ANSI-stripping layer
      displayed `branches: ain]`. The artifact infected its own correction:
      a previous session already concluded 'the mangled ain] reading was a
      terminal display artifact' in TODO.md, but that sentence's own
      `[main]` was mangled to `ain]` in the stored record, so the ghost kept
      propagating (T-C33/T-C34/T-C35 worklogs + the T-C35-merge standing
      reminder all repeat it)."
    - "Behavioral proof the triggers WORK: GitHub Actions run history (API,
      2026-09-29) shows push-triggered runs firing on every main push on
      both repos, all green — core 5b946ba (the #33 merge) push run SUCCESS;
      hub 0bc6ee9/43c1fde/f9130b3/50ca841/9c3c74d/b02178e/235f5cd push runs
      SUCCESS — including 50ca841, the exact commit the T-C35-merge record
      claims was 'push-CI broken'. The earlier quiet period was the Actions
      minutes quota blackout (CI-RECOVERY-RUNBOOK), not YAML corruption."
  scope:
