  title: "CI trigger verdict + the phantom 'corrupted branches' correction, and
    hub font pinning — commit every Google Font as a repo asset and switch
    next/font/google → next/font/local so production builds are hermetic
    (kills the recurring Turbopack font-fetch CI flake)"
  owner: "superz (main agent, zai session discord:ObviousGazelle)"
