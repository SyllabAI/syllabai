task:
  id: T-C79
  title: "Exam-series calendar (curriculum-imported) + learner-declared target series — the ADR-035 D1 foundation for the exam-aware study planner"
  owner: Super Z
  status: DONE
  priority: P1
  base:
    repo: SyllabAI/syllabai (master governance)
    commit: 983430d
  authority: |
    ADR-035 (drafted 2026-10-04 as the T-C76 executive-half R2, Status: Proposed)
    gated acceptance on D1 (exam-date ownership). The operator ruled 2026-10-04
    (zai-web trace 1a10493e233cb521 — the ruling is quoted VERBATIM in ADR-035's
    "Ruling 2026-10-04" section): the exam-series calendar is curriculum-imported
    reference data (the ADR's option ②), and the learner makes one bounded, optional
    declaration — which imported series a course targets — never entering dates.
    ADR-035 Status -> Accepted the same day (original preamble preserved verbatim
    in the document); the teacher-entry proposal §1 is superseded; the rejected ③
    (learner-entered timetables/dates) STANDS. The operator's sequencing word
    "T-C77 first" (trace 1a1049b6b711093d) placed this lane after the surface
    correction (T-C78 — merged and first-hand re-verified post-sandbox-reset,
    see claims).
  background: |
    ADR-035's recon: no exam-date entity exists anywhere (verified on core ab33709)
    — the planner's central input has no source of truth and no owner. The ruled
    design gives it both, without opening the garbage-in channel the ADR rejected:
    (a) a reference calendar `exam_series` (board, qualification IGCSE|IAL, code e.g.
    2027-may-june, label, window_start/window_end, optional entry_deadline and
    results_date, published flag, source citation + retrieved-at) imported via the
    ADR-021 content-package path — cadence is DATA (Pearson Edexcel IGCSE May/June +
    November; IAL January + May/June + October/November), with per-subject availability
    overrides, never hardcoded; (b) learner course gains ONE optional nullable
    target-series reference (settable in hub's add-course overlay at enrolment,
    editable and clearable thereafter); (c) countdowns (days_to_window) computed at
    READ, never persisted (ADR-031 doctrine), exposed through the T-C76 agenda read
    model and the T-C78 hub dashboard surface; (d) unpublished windows are absent or
    flagged estimated and rendered honestly — no seed row without a citable Pearson
    source. NBA v2.0 time-pressure multiplier + assignments->NBA seam + reason-code
    family remain ADR-035-scoped follow-up lanes; the NBA engine is byte-untouched
    this lane.
