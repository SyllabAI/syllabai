      - "hub: optional exam-series picker in the add-course overlay (empty calendar -> honest disabled/hidden state, never a fake list); dashboard countdown chip over the exposed read model; CORE_MEASURED provenance labelling per the hub honesty posture"
      - "content: exam-calendar dataset schema + importer validation; seed rows ONLY with a citable Pearson source (operator-provided key dates); absence ships as an honest empty state"
      - "master: task record + locks + TODO dated section + WORKLOG session"
    forbidden:
      - "any learner-entered date/window/timetable free-text anywhere (the rejected ③ — no exceptions)"
      - "NBA engine changes (NextBestActionService, RecommendationProperties, nba-rules — the v2.0 multiplier is a later lane under ADR-035's own scope)"
      - "persisted countdowns or any derived schedule rows (ADR-031: derived is recomputed, never stored)"
      - "notifications, streaks, plan persistence, parent-facing surface (ADR-035 Rejected/Parked stands)"
