  basis: >
    T-C57 unified the hub's queue over the derived feed ∪ the device
    trail with newest-evidence-wins per card, and deliberately did NOT
    cross-merge trails: core served derived schedules, not raw events, and
    merging two DERIVED schedules would invent history. This lane widens
    the contract the honest way — core serves the RAW append-only V47
    trail (bounded, keyset-paged, newest first), so both sides are event
    streams and a true chronological merge per card invents nothing: the
    merged trail is exactly the events that exist, each represented once.
    The Ebbinghaus derivation stays bit-for-bit the frozen
    lib/flashcard-review.ts ladder (registry learner.flashcard-review
    v1-hub-parity, ADR-031 computed-at-read) — the derivation input
    changes from "one side's trail" to "the union of both sides' events",
    the arithmetic does not.
    DEDUP IS THE LOAD-BEARING DESIGN POINT (recorded because it shaped the
    contract): V47 stamps occurred_at SERVER-side (the hub POST carries no
    timestamp — FlashcardRatingController uses Instant.now()), so the same
    physical flip has a device-clock timestamp in localStorage and a
    server-clock timestamp in core — (cardId, rating, occurredAt) cannot
    dedup across sides, and a heuristic window would corrupt legitimate
    re-rates. Duplicates are not cosmetic: the ladder's interval is driven
    by the trailing KNOW streak, so a double-counted "know" would inflate
    the streak and push a card's due date OUT (under-practice). The honest
    fix is receipts at the only moment the truth is knowable: the bridge
    ALREADY learns the sync outcome per flip (submitFlashcardRating
    resolves synced / local-only), it just never persisted it. This lane
    records the outcome on the device trail entry (additive optional
    `sync: "core" | "local"` — no schema break: absent = recorded before
    this lane). Merge rule per card: account events + device entries
    marked "local" + device unmarked entries ONLY when the account has no
    events for that card (historical unmarked events might BE the account
    copy — dropping them errs due-EARLIER, the conservative direction:
    over-practice, never under). Synced device entries are dropped (core
    is append-only; a 2xx POST means the row exists and nothing deletes
    it).
