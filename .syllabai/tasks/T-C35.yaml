version: 1
task:
  id: T-C35
  title: "F-072 Class Knowledge Graph Heatmap — the teacher-facing class KG that
    aggregates member skill states into §13.3 distributions and fuses the TFA-03
    teaching-coverage overlay (syllabai-core aggregation + syllabai-hub surface)"
  owner: "superz (main agent, zai session discord:ObviousGazelle)"
  status: DONE
  priority: P1
  base:
    repo: syllabai-core + syllabai-hub
    commit: core daf89bf (tfa-teaching-coverage — stacked on the T-C33 classroom
      branch; this branch CONSUMES V51 class_members and V52 teaching_coverage,
      so it must merge after PRs #31 and #32) + hub 3f5dec2 (PR #1 classroom
      foundation — the /teacher/classes workspace this page hangs off)
  basis: >
    Operator directive (Discord DM, 2026-09-29): "F-072 Class KG heatmap
    consuming this overlay" — i.e. the T-C34 next_safe_action, taken up.
    syllabai-master-project.tsv F-072 (Teacher Hub B2B, Analytics, P1, Wave 3:
    "See which topics the whole class struggles with. Aggregate student KGs;
    color-coded nodes. Backend aggregation; frontend same graph component";
    blocked-by satisfied: TFA-03 shipped), TEACHER_ARCHITECTURE.md §13.1–13.5
    (semantic states, the ⚪=not-taught rule, §13.3 aggregation fields — class
    mastery is NOT a single average, §13.4 the taught/not-taught × understanding
    matrix, §13.5 node interaction), T-C34 next_safe_actions.
  scope:
    allowed:
      - "core: one additive read endpoint GET
        /api/v1/teacher/classes/{classId}/knowledge-graph?rootId= (mirrors the
        T-C34 coverage route and gate order: class 404 → owned 403 → root node
        404); READ-ONLY — no new tables, no migration, no Flyway lease"
      - "core: class-scale repository methods — SkillStateRepository
        findByLearnerIdInAndNodeIdIn + MisconceptionStateRepository
        findByLearnerIdInAndMisconceptionNodeIdIn (one batched query each; the
        per-learner-loop pattern stays banned per ClassAnalyticsService)"
      - "core: ClassKnowledgeGraphService — subtree topology from
        KnowledgeGraphService; aggregation over EXACTLY the enabled class
        members (ClassMember rows joined to enabled users — the assignment
        roster rule); per-node: learnersMeasured, mean EFFECTIVE (decayed)
        mastery, distribution counts via the shared DecayParams.bandOf
        vocabulary (struggling=LOW / developing=DEVELOPING / proficient=SECURE),
        attempts, correctCount, learnersWithActiveMisconception; coverage fusion
        — per-node coverageState derived honestly: spec points verbatim from
        their recorded row (taught | not-taught | unrecorded), non-spec nodes
        derived from descendant spec-point rows (taughtSpecPoints>0 → taught,
        recordedSpecPoints>0 → not-taught, else unrecorded) with the counts
        exposed so the client never has to re-derive"
      - "hub: /teacher/classes/[id]/knowledge-graph — full-bleed page reusing
        the KGExplorer engine (the 'same graph component' rule — no second KG
        implementation); KGXNode gains coverage/coverageState + distribution
        fields; a class-coverage lens paints: taught nodes by the engine band
        palette on class mean mastery, explicitly-not-taught nodes as a dashed
        grey ring, unrecorded as no ring (grey semantics per the T-C34 ruling:
        grey = absent teaching coverage, never low understanding); node panel
        shows §13.3 distribution bars + teaching status + evidence; a legend
        pins the semantics; linked from the class detail page"
    forbidden:
      - "THE INDEPENDENT-STUDENT RULE — the aggregate joins class_members ONLY;
        a student without a membership row in this class must not move a single
        aggregated number, ever (IT-pinned: an independent student with skill
        states on the same nodes leaves the payload byte-identical)"
      - "no learner-model writes — the heatmap is a read model; coverage traffic
        and aggregation traffic write no BKT/SkillState/misconception/review rows"
      - "no fabricated rows — unpractised nodes carry nulls (never zeros, never a
        fabricated band); unrecorded coverage is unrecorded (no invented
        NOT_TAUGHTs); meanMastery null when learnersMeasured = 0"
      - "no second KG implementation — hub renders the existing KGExplorer with a
        new host adapter; core reuses KnowledgeGraphService topology + the
        shared band vocabulary; no new mastery/understanding enum (STRONG/WEAK/
        CRITICAL stays unbuilt; the engine bandColor palette remains the UI
        decision §13.1 allows)"
      - "no curriculum mutation — knowledge_nodes read-only (NO-ACTION FK ruling
        stands); no course_slug cross-check in core (hub-owned opaque slug)"
      - "archived classes remain READABLE (a teacher may inspect a past class's
        heatmap) — the 409 archived gate is a WRITE gate, not applied here"
      - "no student-level drill-down payload (affected-student lists, individual
        graphs) — that is TFA-07's surface; this task stops at class-level
        aggregation"
  dependencies:
    - T-C33 (V51 classes/class_members; core PR #31, hub PR #1 — unmerged)
    - T-C34 (V52 teaching_coverage + the coverage contract; core PR #32 —
      unmerged; this branch is stacked on it)
  shared_resources:
    - core-web-contract (additive teacher read endpoint only; zero change to any
      existing payload — deploy-skew safe both directions; released on push)
  acceptance:
    - A teacher opens their class's KG: nodes paint by §13.4 — taught+strong
      teal … taught+weak rose, explicitly-not-taught dashed grey, unrecorded
      ringless; the distribution bars show §13.3's percentages, not just an
      average
    - Aggregation covers exactly the enabled members; an independent student's
      evidence never enters the class payload (IT-pinned)
    - A second teacher is 403; unknown class/root is 404; unauthenticated is 401
      (route rule); read-only provenance — no learner-model rows created
    - Unmeasured nodes are honest nulls; unrecorded coverage is honest absence
    - Hub renders the SAME KGExplorer component the Class Intelligence SIM page
      uses, on live core data, with the SIM disclosure not carried over
  tests:
    - core: ClassKnowledgeGraphControllerTest (unit, Mockito — gates, enabled
      filter, distribution math, coverageState derivation, honesty nulls)
    - core: ClassKnowledgeGraphFlowIT (Testcontainers — real members vs
      independent student, coverage fusion, decay semantics, authorization,
      read-only pin)
    - hub: tsc + eslint + production build (route registered); engine lens smoke
      via existing patterns
    - CI: core-ci green on the stacked branch; hub-ci green on the hub branch
  evidence_required:
    - CI runs green on both stacked branches (which run the T-C33/T-C34 suites
      too)
    - worklog + TODO claim/closeout entries in the master pack
  claims:
    VERIFIED: ["core-ci SUCCESS on b02364f (full suite + failsafe ITs incl. ClassKnowledgeGraphFlowIT 3/3 — theFullHeatmap, gates + archived readability, empty-class honesty)", "hub-ci SUCCESS on ee31ad1 (typechecked production build + Playwright e2e + axe a11y gate) with /teacher/classes/[id]/knowledge-graph registered", "core unit suite 1,048 green locally (JDK 25) incl. ClassKnowledgeGraphServiceTest 6/6 + ClassKnowledgeGraphControllerTest 2/2", "independent-student rule IT-proven: a non-member student with stronger evidence than every member on the same nodes leaves every aggregate byte-identical"]
    INFERRED: []
    REPORTED: []
    UNVERIFIED: ["core-ci SUCCESS on b02364f (full suite + failsafe ITs incl. ClassKnowledgeGraphFlowIT 3/3 — theFullHeatmap, gates + archived readability, empty-class honesty)", "hub-ci SUCCESS on ee31ad1 (typechecked production build + Playwright e2e + axe a11y gate) with /teacher/classes/[id]/knowledge-graph registered", "core unit suite 1,048 green locally (JDK 25) incl. ClassKnowledgeGraphServiceTest 6/6 + ClassKnowledgeGraphControllerTest 2/2", "independent-student rule IT-proven: a non-member student with stronger evidence than every member on the same nodes leaves every aggregate byte-identical"]
  execution_notes: >
    Stacked both repos: core tfa-class-kg-heatmap on tfa-teaching-coverage (PR
    #33 base tfa-teaching-coverage — merge order #31 → #32 → #33), hub
    f072-class-kg-heatmap on the PR #1 head 3f5dec2 (PR #2 base
    tfa-classroom-foundation). ONE CI catch on core, and it is the same
    lesson T-C34 wrote down: the unit mock (anyCollection) hid a wrong
    query argument — the service passed the TOPIC ids (misconceptionsOf is
    keyed by parent) where the MISCONCEPTION node ids were required, so the
    unit suite was green while the Testcontainers IT failed the prevalence
    assertion (expected 1, was 0). Fix: collect() now also emits the flat
    misco-node-id set; the query boundary is pinned in BOTH layers
    (containsExactly(miscoA) in units, real SQL in the IT). Hub caught
    nothing — but the new react-hooks set-state-in-effect rule forced the
    house data-fetching shape (state lands in async callbacks only).
    Design decisions worth keeping: aggregation means EFFECTIVE (decayed)
    mastery at one pinned asOf ("aggregate what the student KG shows", not
    ClassAnalyticsService's stored mastery); distribution buckets = the
    shared DecayParams.bandOf vocabulary (LOW/DEVELOPING/SECURE =
    struggling/developing/proficient); coverageState is derived SERVER-SIDE
    (spec points verbatim, topics from descendant rows with counts exposed)
    so the client never re-derives; archived classes stay READABLE by
    design (409 is a write gate); engine color = the v75 bandColor palette
    (the §13.1 UI-decision allowance) with not-taught as a DASHED grey ring
    — grey/dashed means absent coverage, never low understanding.
  next_safe_actions:
    - TFA-07 KG drill-down (click a weak node → affected students →
      individual graphs) — the aggregation here is its substrate
    - TFA-05 Teacher Data Assistant reading coverage as a query dimension
    - coverage checklist UI inside /teacher/classes/[id] (T-C34
      next_safe_action, still open) so teachers can mark from the hub
    - after #31/#32/#33 + hub #1/#2 merge, retarget and fast-forward the
      stacked PRs in order
